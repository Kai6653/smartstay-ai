<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartStay AI</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1d2733;--accent:#0f766e;--muted:#6b7785;--border:#dde3ea;--user:#0f766e;--bot:#e9eef3}
  @media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--text:#e7edf3;--muted:#92a0ae;--border:#2a3745;--bot:#243140}}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0} nav button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;margin-left:6px}
  nav button.on{background:#fff;color:var(--accent)}
  main{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;min-height:0}
  .consent{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;font-size:13px;color:var(--muted)}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.4;font-size:14px}
  .u{align-self:flex-end;background:var(--user);color:#fff} .b{align-self:flex-start;background:var(--bot)}
  .meta{font-size:11px;color:var(--muted);margin-top:4px} .warn{border-left:3px solid #d97706}
  form{display:flex;gap:8px;padding:12px 16px;background:var(--card);border-top:1px solid var(--border)}
  input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 16px;cursor:pointer}
  .chips{padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer}
  #staff{display:none;padding:16px;overflow:auto;flex:1} table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px;border-bottom:1px solid var(--border);text-align:left} .stats{margin:8px 0;color:var(--muted);font-size:13px}
  td button{font-size:12px;margin-right:4px}
</style>
</head>
<body>
<header><h1>🏨 SmartStay AI</h1>
  <nav><a href="/survey" style="color:#fff;font-size:13px;margin-right:6px">Survey</a><button id="tabGuest" class="on">Guest chat</button><button id="tabStaff">Staff</button></nav></header>
<main>
  <div id="guest" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="consent"><label><input type="checkbox" id="consent"> I agree to save my preferences (e.g. vegetarian, history) to personalise suggestions. Untick to delete them.</label></div>
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><input type="text" id="msg" placeholder="Ask about the hotel, nearby places, or request a service…" autocomplete="off"><button class="send">Send</button></form>
  </div>
  <div id="staff">
    <input type="password" id="tok" placeholder="Staff token" value="change-me"> <button onclick="loadStaff()">Load</button>
    <div class="stats" id="stats"></div><table><thead><tr><th>#</th><th>Type</th><th>Detail</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script>
const sid = localStorage.sid || (localStorage.sid = crypto.randomUUID());
const $ = id => document.getElementById(id);
const log = $("log");
function add(text, cls, meta, warn){
  const d = document.createElement("div"); d.className = "m " + cls + (warn ? " warn" : ""); d.textContent = text;
  if (meta){ const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
add("Hello! I'm SmartStay AI, an AI assistant for this hotel. I can answer questions, suggest things to do, plan your day and send service requests. For urgent issues I'll connect you to a human.", "b");
["What time is breakfast?","Suggest vegetarian dinner","Plan a 1-day trip, budget $60","Send extra towels to my room","I want to complain, the room is dirty"].forEach(t=>{
  const b=document.createElement("button"); b.textContent=t; b.onclick=()=>{$("msg").value=t; $("f").requestSubmit();}; $("chips").appendChild(b);});
fetch("/api/profile/"+sid).then(r=>r.json()).then(p=>$("consent").checked=p.consent);
$("consent").onchange = e => fetch("/api/consent",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,consent:e.target.checked})});
$("f").onsubmit = async e => {
  e.preventDefault(); const t = $("msg").value.trim(); if(!t) return; $("msg").value=""; add(t,"u");
  try{
    const r = await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,message:t})});
    const j = await r.json();
    const meta = [j.intent, j.sources.length ? "Sources: "+j.sources.join(", ") : "", j.personalised ? "personalised" : ""].filter(Boolean).join(" · ");
    add(j.reply,"b",meta,j.handoff);
  }catch(err){ add("Sorry, something went wrong. A staff member can help you at the front desk.","b",null,true); }
};
$("tabGuest").onclick=()=>{$("guest").style.display="flex";$("staff").style.display="none";$("tabGuest").className="on";$("tabStaff").className=""};
$("tabStaff").onclick=()=>{$("guest").style.display="none";$("staff").style.display="block";$("tabStaff").className="on";$("tabGuest").className="";loadStaff()};
async function loadStaff(){
  const r = await fetch("/api/staff/requests",{headers:{"X-Staff-Token":$("tok").value}});
  if(!r.ok){ $("stats").textContent="Wrong staff token."; return; }
  const j = await r.json();
  $("stats").textContent = `Messages: ${j.stats.messages} · Avg rating: ${j.stats.avg_rating ?? "n/a"}`;
  $("rows").innerHTML = "";
  j.requests.forEach(q=>{
    const tr=document.createElement("tr");
    [q.id,q.kind,q.detail,q.status].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
    const td=document.createElement("td");
    ["in_progress","done"].forEach(s=>{const b=document.createElement("button");b.textContent=s;
      b.onclick=async()=>{await fetch(`/api/staff/requests/${q.id}/${s}`,{method:"POST",headers:{"X-Staff-Token":$("tok").value}});loadStaff()};td.appendChild(b)});
    tr.appendChild(td); $("rows").appendChild(tr);
  });
}
</script>
</body>
</html>
